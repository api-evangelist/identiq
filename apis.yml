aid: identiq
name: Identiq
description: >-
  Identiq operates a privacy-preserving, peer-to-peer identity validation network
  that lets member companies confirm a customer is already known and trusted by
  other members without any party sharing, exposing, or centralizing personal data.
  Its patented anonymized protocol keeps identity data encrypted inside each
  member's own environment while answering cross-network trust queries in real time.
  Products include customer identification, sign-up validation, risk-based
  onboarding, payment optimization, and trust & safety, serving travel, e-commerce,
  ticketing, fintech, telco, and marketplace verticals. Identiq is a cybersecurity
  company backed by Insight Partners and was added to the API Evangelist network as
  a portfolio lead; it publishes a public trust center but no public developer API.
